    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var chatContainer = document.getElementById("chat-container");
            var messageForm = document.getElementById("message-form");
            var userInput = document.getElementById("user-input");

            messageForm.addEventListener("submit", function (e) {
                e.preventDefault();

                // Get the CSRF token from the hidden input field
                var csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;


                // Get the user's message from the input field
                var userMessage = userInput.value;

                // Add the user's message to the chat container
                chatContainer.innerHTML += "<p>User: " + userMessage + "</p>";

                var usrMsgs = {
                    "userId": 2,
                    "sessionId":1, 
                    "questionType":"text", 
                    "question":userMessage
                    
                };
                console.log(usrMsgs, '#######');
                // Clear the input field
                userInput.value = "";

                // Send the user's message to the Django view for processing
                fetch("http://localhost:8000/api/send_question", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken, // Include the CSRF token in the request headers

                    },
                    // beforeSend: function(xhr, settings) {
                    //     xhr.setRequestHeader("X-CSRFToken", "{{ csrf_token }}");
                    // },
                    body: JSON.stringify({ message: usrMsgs }),
                })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {
                        console.log(data, 'rreets------');
                        // Display the response from the Django view
                        chatContainer.innerHTML += "<p>AI: <pre>" + data.response.text + "</pre></p>";
                    })
                    .catch(function (error) {
                        console.error("Error sending message:", error);
                    });
            });
        });

    </script>
