{% extends 'base.html' %}
{% load static %}
{% block content %}
{{block.super}}
   

    <div class="container" style="margin: 0;height: 100%;">
        <div class="row" style="height: 100%;">
            <!-- This is for the LEFT BAR -->
            <section class="col-3 shadow-sm" style="background-color: lightslategray;color: white;">
                <h1 class="text-3xl font-bold mb-4" style="text-align: center;margin-top: 5px;margin-bottom: 10px;">
                    Analytica Bot
                </h1>
                <div style="text-align: center;">
                    <button type="button" class="btn btn-dark" style="width: 80%;">
                        New Chat
                    </button>
                </div>

                <hr style="position: absolute;
                width: 22%;
                bottom: 6.5rem;">

                <div class="card shadow-sm bg-transparent" style="position: absolute; bottom: 2rem; width: 22%;">
                    <div class="card-body d-flex align-items-center" style="padding: 3px 10px;color:azure;">
                        <img src="https://images.unsplash.com/photo-1474447976065-67d23accb1e3?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2785&q=80" class="rounded" alt="..." style="height: 6%; width: 9%;">
                        <h1 class="text-1.5xl font-bold ms-4">John Doe</h1>
                        <div class="ms-auto">
                            <div class="dropup-center dropup">
                                <span class="material-symbols-outlined" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">more_vert</span>
                                <ul class="dropdown-menu dropdown-menu-dark">
                                    <li><a class="dropdown-item" href="#">Another action</a></li>
                                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" href="#">Sign Out</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="col-9">
                <h3 class="text-3xl font-bold" style="text-align: center;">
                    Data Analysis Asistant
                </h3>
                <div style="height: 80%;">
                    <div id="chatHistoryContainer"></div>
                    <div>
                        {{data.role}}
                    </div>

                </div>
                <form id="myForm" style="background-color: white; position: absolute; bottom: 0;width: 100%;">
                    {% csrf_token %}
                    <div class="mb-3" 
                    style="
                        padding: 10px;
                        width: 60%;
                        background-color: white;"
                    >
                        <label for="exampleFormControlTextarea1" class="form-label" style="font-size: 13px;">Write your prompt</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" name="prompt"></textarea>
                    </div>
                    <button type="button" id="submitButton" class="btn btn-outline-secondary" onclick="submitData()" style="
                    bottom: 30;
                    right: 130;
                    width: 7%;"
                    >
                        Send
                    </button>
                </form>
            </section>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript">
        
        var results = []
        localStorage.clear()
        var storedData = localStorage.getItem('yourKey'); // Replace 'yourKey' with the key you used to store the data

        if (storedData !== null) {
            // Data was found in local storage, you can use it
            console.log('Data retrieved from local storage:', storedData);
            results = storedData;
        } else {
            // Data was not found in local storage
            console.log('Data not found in local storage');
            results = [{role: 'AI', content: 'Try again'}];
        }
        console.log(results);
        displayChatHistory(results)
        function submitData( challenge_id ){
            const formData = $("#myForm").serialize();
            chatHistory = []
            
            results.push({"role":"user", "content":formData});

            $.ajax({
                type: "POST",
                url: 'http://localhost:8000/api/send_question',
                data: formData,
                beforeSend: function(xhr, settings) {
                    xhr.setRequestHeader("X-CSRFToken", "{{ csrf_token }}");
                },
                success: function(data) {
                    console.log(data,'######ääääääää');
                    
                    results.push({"role":"AI", "content":data.data});

                    localStorage.setItem('yourKey', results);

                    console.log(results, 'ÄÄÄÄÄÄÄÄÄ');
                    displayChatHistory(results)
                },
                error: function(xhr, status, error) {
                    console.error("Error:", error);
                }

            });
            return results
        }


        function displayChatHistory(history) {
            var container = $("#chatHistoryContainer");

            for (var i = 0; i < history.length; i++) {
                var item = history[i];
                var role = item.role;
                var content = item.content;

                // Only display user messages with meaningful content
                if (role === 'user' && content.trim() === '') {
                    continue; // Skip empty user messages
                }

                // Create a chat message element
                var messageElement = document.createElement("div");
                messageElement.textContent = role + ": " + content;

                // Append the message to the container
                container.append(messageElement);
            }
        }
        
    </script>
{% endblock %}
